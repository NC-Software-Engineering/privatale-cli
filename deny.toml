[graph]
all-features = true

[advisories]
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = ["AGPL-3.0-only", "MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
