name: public-core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 25.2.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.13.7
      - name: Restore test environment
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libsodium23=1.0.18-1ubuntu0.24.04.1 libargon2-1=0~20190702+dfsg-4build1
          dpkg-query -W libsodium23 libargon2-1
          python3 -m pip install --require-hashes -r tests/oracles/requirements.txt
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          cargo fetch --locked
          google-chrome --version
      - name: Public source and secrets
        run: |
          python3 scripts/bootstrap-tools.py
          python3 scripts/check-public-source.py
          python3 scripts/check-secrets.py tree
          python3 scripts/check-secrets.py history
          python3 tests/security/check-scanner.py
      - name: Native, WASM and independent oracles
        run: bash scripts/check-p1.sh
      - name: Real browser
        run: node scripts/check-browser.mjs
      - name: Current dependency advisories and licenses
        run: |
          .tools/bin/cargo-audit audit
          .tools/bin/cargo-deny check
